<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aivora Eco Industries – Disposable & Eco-Friendly Packaging Solutions Across India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@600&family=Inter:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2fcf2; --sage:#ecf6ec; --sage-2:#e1ebe1; --sage-3:#dbe5db;
    --green:#005318; --green-2:#296c00; --text:#40493d; --ink:#151e18; --placeholder:#9ca3af;
    --shadow-sm:0 1px 1px rgba(0,0,0,.05);
    --shadow-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased}
  img{display:block;max-width:100%}
  a{text-decoration:none;color:inherit}

  .wrap{max-width:1280px;margin:0 auto;padding-left:64px;padding-right:64px}
  .eyebrow{font:700 12px/16px 'Inter',sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--green-2);margin-bottom:4px}
  h1,h2{font-family:'EB Garamond',serif;font-weight:600;color:var(--green)}
  h2{font-size:40px;line-height:48px;letter-spacing:-.4px}
  h3,h4{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;color:var(--green);font-size:22px;line-height:30px}
  .lead{font-size:18px;line-height:28px;color:var(--text);max-width:672px}
  .sec-head{margin-bottom:40px}
  .sec-head h2{margin-bottom:4px}
  .icon-box{width:48px;height:48px;border-radius:8px;background:var(--sage-2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .icon-box img{max-width:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;font:600 14px/20px 'Inter',sans-serif;letter-spacing:.28px;border-radius:4px;cursor:pointer;border:0}

  /* 1. Hero */
  .hero{padding:64px 0}
  .hero-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:40px;align-items:center}
  .hero-left{grid-column:1/span 7}
  .hero-right{grid-column:8/span 5;position:relative;height:460px;border-radius:16px;overflow:hidden;background:var(--sage-3);box-shadow:var(--shadow-md)}
  .hero-right>img{width:100%;height:100%;object-fit:cover}
  .pill{display:inline-flex;align-items:center;gap:4px;background:var(--sage-2);border-radius:12px;padding:4px 16px;margin-bottom:16px}
  .pill i{width:8px;height:8px;border-radius:50%;background:var(--green-2);display:block}
  .pill span{font:700 12px/16px 'Inter',sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--green-2)}
  h1{font-size:56px;line-height:70px;letter-spacing:-1.12px;margin-bottom:16px}
  .hero-left .lead{margin-bottom:40px}
  .cta-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
  .btn-solid{background:var(--green);color:#fff;padding:16px 24px;box-shadow:var(--shadow-sm)}
  .btn-outline{border:2px solid var(--green);color:var(--green);padding:16px 24px}
  .hero-badge{position:absolute;top:16px;left:16px;display:flex;align-items:center;gap:4px;padding:6px 16px;border-radius:12px;background:rgba(242,252,242,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .hero-badge span{font:700 11px/14px 'Inter',sans-serif;letter-spacing:.55px;text-transform:uppercase;color:var(--green)}

  /* 2. Highlights */
  .highlights{padding:32px 0}
  .hl-grid{display:flex;gap:24px;align-items:stretch}
  .hl-card{flex:1 1 0;min-width:0;background:#fff;border-radius:16px;padding:24px;display:flex;gap:16px;align-items:flex-start;box-shadow:var(--shadow-sm)}
  .hl-card h3{margin-bottom:4px}
  .hl-card p{font-size:15px;line-height:24px}

  /* 3. About */
  .about{background:var(--sage);padding:80px 0}
  .about-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:40px;align-items:center}
  .about-text{grid-column:1/span 6}
  .about-text h2{margin-bottom:16px}
  .about-text p.lead{max-width:none;margin-bottom:24px}
  .badges{display:flex;flex-wrap:wrap;gap:8px}
  .badge{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:4px;padding:6px 16px;box-shadow:var(--shadow-sm);font:600 12px/16px 'Inter',sans-serif;letter-spacing:.6px;color:var(--green)}
  .about-img{grid-column:7/span 6;height:400px;border-radius:16px;overflow:hidden;background:var(--sage-3);box-shadow:var(--shadow-md)}
  .about-img img{width:100%;height:100%;object-fit:cover}

  /* 4. Products */
  .products{background:#fff;padding:80px 0}
  .prod-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;align-items:stretch}
  .prod{background:var(--sage);border-radius:16px;padding:24px;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)}
  .prod .thumb{height:176px;border-radius:8px;overflow:hidden;background:var(--sage-3);margin-bottom:4px}
  .prod .thumb img{width:100%;height:100%;object-fit:cover}
  .prod h3{padding-top:12px;margin-bottom:4px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
  .tag{background:var(--sage-3);border-radius:2px;padding:2px 8px;font:600 11px/14px 'Inter',sans-serif;letter-spacing:.88px;color:var(--green)}
  .prod p{font-size:15px;line-height:24px;padding-top:4px;margin-bottom:24px}
  .prod .btn{margin-top:auto;background:var(--green);color:#fff;padding:10px 0;font-size:12px;line-height:16px;letter-spacing:.6px;width:100%}

  /* 5. Creative 1 */
  .creative1{background:var(--sage);padding:80px 0}
  .c1-grid{display:flex;gap:24px;align-items:stretch}
  .c1-col{flex:1 1 0;min-width:0}
  .c1-col.stack{display:flex;flex-direction:column;gap:24px}
  .c1-tall{position:relative;border-radius:16px;overflow:hidden;min-height:460px;height:100%;background:var(--sage-3);box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .c1-tall img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .c1-tall .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,83,24,.8),rgba(0,83,24,0) 50%);display:flex;align-items:flex-end;padding:24px}
  .c1-tall .ov p{font:600 22px/30px 'Plus Jakarta Sans',sans-serif;color:var(--bg);max-width:271px}
  .c1-card{background:#fff;border-radius:16px;padding:24px;box-shadow:var(--shadow-sm);flex:1;display:flex;flex-direction:column;justify-content:center}
  .c1-card .big{font:600 56px/56px 'EB Garamond',serif;letter-spacing:-1.12px;color:var(--green);margin-bottom:4px}
  .c1-card .big.alt{color:var(--green-2)}
  .c1-card h4{margin-bottom:4px}
  .c1-card p{font-size:15px;line-height:24px}
  .c1-card .icon-box{margin-bottom:16px}

  /* 6. Creative 2 */
  .creative2{background:#fff;padding:80px 0}
  .ind-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
  .ind{background:var(--sage);border-radius:16px;padding:24px;box-shadow:var(--shadow-sm)}
  .ind h3{padding-top:12px;margin-bottom:4px}
  .ind p{font-size:15px;line-height:24px}

  /* 7. Banner */
  .banner-wrap{padding:48px 0}
  .banner{background:var(--green);border-radius:24px;padding:40px;display:flex;align-items:center;justify-content:space-between;gap:40px;box-shadow:var(--shadow-md)}
  .banner h2{color:#fff;margin-bottom:4px}
  .banner p{font-size:18px;line-height:28px;color:var(--sage-2);max-width:672px}
  .banner .btn{background:#fff;color:var(--green);padding:16px 24px;border-radius:12px;box-shadow:var(--shadow-sm);white-space:nowrap;flex-shrink:0}

  /* 8. Contact */
  .contact{background:var(--sage);padding:80px 0}
  .contact-head{text-align:center;max-width:768px;margin:0 auto 40px}
  .contact-head h2{margin-bottom:4px}
  .contact-head .lead{max-width:none}
  .cards4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-bottom:40px}
  .ccard{background:#fff;border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:var(--shadow-sm);transition:transform .15s}
  .ccard:hover{transform:translateY(-2px)}
  .ccard .icon-box{margin-bottom:8px}
  .ccard h4{margin-bottom:2px}
  .ccard .sub{font-size:13px;line-height:20px;margin-bottom:4px}
  .ccard .val{font:700 12px/16px 'Inter',sans-serif;letter-spacing:.6px;color:var(--green)}
  .ccard .val.alt{color:var(--green-2)}

  .form-card{background:#fff;border-radius:16px;padding:40px;max-width:896px;margin:0 auto;box-shadow:var(--shadow-sm)}
  form{display:flex;flex-direction:column;gap:24px}
  .row2{display:flex;gap:16px}
  .field{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px}
  label.lbl,.lbl{font:600 12px/16px 'Inter',sans-serif;letter-spacing:.6px;color:var(--ink)}
  input[type=text],input[type=tel],textarea{width:100%;background:var(--sage);border:0;border-radius:4px;font:400 15px 'Plus Jakarta Sans',sans-serif;color:var(--ink);padding:12.5px 16px;height:44px;outline:none}
  textarea{height:128px;padding:16px;line-height:24px;resize:vertical}
  input::placeholder,textarea::placeholder{color:var(--placeholder)}
  input[type=text]:focus,input[type=tel]:focus,textarea:focus{box-shadow:0 0 0 2px var(--green)}
  .checks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-top:4px}
  .check{display:flex;align-items:center;gap:8px;background:var(--sage);border-radius:4px;padding:8px;min-height:36px;font-size:13px;line-height:20px;color:var(--ink);cursor:pointer}
  .check input,.radio input{width:13px;height:13px;margin:0;flex-shrink:0;accent-color:#0075ff;cursor:pointer}
  .radio-row{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
  .radio-opts{display:flex;gap:24px}
  .radio{display:flex;align-items:center;gap:8px;font-size:15px;line-height:24px;color:var(--ink);cursor:pointer}
  .submit{width:100%;background:var(--green);color:#fff;padding:14px 0;box-shadow:var(--shadow-sm)}
  .submit:disabled{opacity:.65;cursor:not-allowed}
  .status{display:none;border-radius:4px;padding:12px 16px;font-size:14px;line-height:20px}
  .status.ok{display:block;background:#dff3df;color:var(--green)}
  .status.err{display:block;background:#fde8e8;color:#9b1c1c}

  /* Responsive */
  @media (max-width:1100px){
    .wrap{padding-left:32px;padding-right:32px}
    .prod-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .cards4{grid-template-columns:repeat(2,minmax(0,1fr))}
    .c1-grid{flex-wrap:wrap}
    .c1-col{flex:1 1 calc(50% - 12px)}
    .c1-col.tall-col{flex-basis:100%}
    .ind-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:860px){
    h1{font-size:44px;line-height:54px}
    h2{font-size:34px;line-height:42px}
    .hero-grid,.about-grid{grid-template-columns:1fr}
    .hero-left,.hero-right,.about-text,.about-img{grid-column:1/-1}
    .hero-right{height:360px}
    .about-img{height:320px}
    .hl-grid{flex-direction:column}
    .banner{flex-direction:column;align-items:flex-start}
  }
  @media (max-width:640px){
    .wrap{padding-left:16px;padding-right:16px}
    .hero,.about,.products,.creative1,.creative2,.contact{padding-top:48px;padding-bottom:48px}
    h1{font-size:34px;line-height:42px;letter-spacing:-.6px}
    h2{font-size:28px;line-height:36px}
    .lead,.banner p{font-size:16px;line-height:26px}
    .prod-grid,.cards4,.ind-grid,.checks{grid-template-columns:1fr}
    .c1-col{flex-basis:100%}
    .hero-right{height:280px}
    .banner{padding:28px 24px}
    .banner .btn{white-space:normal;text-align:center}
    .form-card{padding:24px 16px}
    .row2{flex-direction:column}
    .cta-row .btn{width:100%}
    .btn-solid,.btn-outline{text-align:center}
  }

  section{scroll-margin-top:80px}
  .site-header{position:sticky;top:0;z-index:50;height:80px;background:rgba(242,252,242,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 1px 8px rgba(13,110,37,.06)}
  .site-header .in{height:80px;padding:0 64px;display:flex;align-items:center;justify-content:space-between;gap:24px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand img{height:52px;width:auto;object-fit:contain}
  .brand span{font:600 14px/20px 'Inter',sans-serif;letter-spacing:.7px;text-transform:uppercase;color:var(--green);white-space:nowrap}
  .nav{display:flex;gap:24px;align-items:center}
  .nav a{font:600 14px/20px 'Inter',sans-serif;letter-spacing:.28px;color:var(--text)}
  .nav a.active{font:600 16px/24px 'Plus Jakarta Sans',sans-serif;color:var(--green)}
  .nav a:hover{color:var(--green)}
  .nav-btn{background:#0d6e25;color:#fff;padding:8px 24px;border-radius:4px;font:600 14px/20px 'Inter',sans-serif;letter-spacing:.28px;box-shadow:var(--shadow-sm);white-space:nowrap}
  .site-footer{background:#0a521b;padding:64px 0 40px}
  .f-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;margin-bottom:64px}
  .f-brand{grid-column:1/span 5}
  .f-nav{grid-column:6/span 3}
  .f-contact{grid-column:9/span 4}
  .f-logo{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .f-logo i{height:48px;padding:4px 8px;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center}
  .f-logo i img{height:100%;width:auto;object-fit:contain}
  .f-logo span{font:700 14px/20px 'Inter',sans-serif;letter-spacing:.7px;text-transform:uppercase;color:var(--bg)}
  .f-brand p{font-size:15px;line-height:24px;color:var(--sage-2);max-width:448px}
  .site-footer h5{font:700 14px/20px 'Inter',sans-serif;letter-spacing:.7px;text-transform:uppercase;color:#fff;margin-bottom:12px}
  .f-nav a,.f-contact a{display:flex;align-items:center;gap:4px;font-size:13px;line-height:20px;color:var(--sage-2);margin-bottom:8px}
  .f-nav a:hover,.f-contact a:hover{color:#fff}
  .f-bottom{border-top:1px solid rgba(242,252,242,.1);padding-top:25px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .f-bottom p{font-size:13px;line-height:20px;color:var(--sage-2)}
  .f-bottom b{font:700 11px/14px 'Inter',sans-serif;letter-spacing:.55px;text-transform:uppercase;color:var(--sage-2)}
  @media (max-width:1100px){.site-header .in{padding:0 32px}.nav{gap:16px}}
  @media (max-width:960px){.nav{display:none}}
  @media (max-width:860px){.f-brand,.f-nav,.f-contact{grid-column:1/-1}}
  @media (max-width:640px){.site-header .in{padding:0 16px}.brand span{font-size:12px}.nav-btn{padding:8px 16px}.site-footer{padding:48px 0 32px}}

  /* validation + popup */
  input.invalid,textarea.invalid{box-shadow:0 0 0 2px #d93025}
  .field-note{display:none;font-size:12px;line-height:16px;color:#d93025;margin-top:2px}
  .invalid+.field-note{display:block}
  .modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px}
  .modal.open{display:flex}
  .modal-box{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:40px 32px 32px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.25);animation:pop .22s ease-out}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-icon{width:64px;height:64px;border-radius:50%;background:var(--sage-2);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
  .modal-icon.err{background:#fde8e8;color:#d93025}
  .modal-icon svg{width:32px;height:32px}
  .modal-box h3{font-size:24px;line-height:32px;margin-bottom:8px}
  .modal-box p{font-size:16px;line-height:26px;color:var(--text);margin-bottom:24px}
  .modal-box .btn{background:var(--green);color:#fff;padding:12px 40px}
</style>
</head>
<body>

<!-- Header -->
<header class="site-header">
  <div class="in">
    <a class="brand" href="#home"><img src="logo.png" alt="Aivora Eco Industries logo"><span>AIVORA™ ECO INDUSTRIES</span></a>
    <nav class="nav">
      <a class="
